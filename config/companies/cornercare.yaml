# Company profile "cornercare". Relevance anchor for every prompt; each area routes to exactly one owner.
# Eval company: a neighborhood pharmacy chain anyone has walked into.

id: cornercare
use: eval
name: CornerCare Pharmacy
summary: US drugstore chain with 300 neighborhood pharmacies in the Midwest (~6,000 employees). Fills prescriptions (including controlled painkillers and ADHD medicines), gives flu and COVID shots, and sells over-the-counter medicines, vitamins, snacks and household goods. Most prescriptions are paid by Medicare, Medicaid or private insurance. No hospitals or clinics, does not make any drugs, no mail-order.
businessLines:
  - Prescription filling, including controlled substances
  - Vaccinations at the pharmacy counter
  - Over-the-counter medicines and vitamins
  - Billing Medicare Part D, Medicaid and private insurers
  - Front-of-store retail (snacks, household goods)
applies:
  - DEA rules for pharmacies that dispense controlled substances (registration, opioids, telehealth prescribing)
  - FDA rules on over-the-counter drugs, drug labeling, drug shortages and recalls that reach pharmacy shelves
  - Medicare Part D and Medicaid payment and pharmacy rules (CMS)
  - CDC vaccine recommendations that change what pharmacists may give
  - Patient privacy (HIPAA) and pharmacy recordkeeping
  - Workplace and labor rules for retail stores
doesNotApply:
  - Approval, manufacturing or inspection rules aimed only at drug or device manufacturers
  - Hospital, nursing-home, physician-payment or clinical-lab rules
  - Research grants, clinical trials, NIH funding notices
  - Banking, securities, aviation, energy, farming
