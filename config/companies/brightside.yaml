# Company profile "brightside". Relevance anchor for every prompt; each area routes to exactly one owner.

id: brightside
use: eval
name: Brightside Foods Co.
summary: US mid-size packaged food company (~900 employees, plants in Ohio and Georgia). Makes hot dogs and sausages, brightly colored gummy candy, and pecan-and-apple snack bars. Buys pecans, apples and corn from US farms. Sells through grocery chains and convenience stores (many customers pay with SNAP / food stamps). Runs its own fleet of 40 delivery trucks. No restaurants, no alcohol, no exports.
businessLines:
  - Hot dogs and sausages
  - Colored gummy candy
  - Pecan and apple snack bars
  - Grocery and convenience-store sales
  - Own delivery truck fleet
applies:
  - FDA food additive and color additive rules (dyes in candy, casings, meat)
  - Food labeling and food safety rules for packaged food and meat products
  - EPA pesticide residue limits on crops we buy (pecans, apples, corn)
  - USDA marketing orders and grading for pecans and apples
  - SNAP rules that change what shoppers can buy or who qualifies (affects demand)
  - Workplace safety and labor rules for food plants; trucking safety rules for our fleet
doesNotApply:
  - Aviation, airspace, aircraft airworthiness
  - Banking, securities, crypto, sanctions
  - Medicare/Medicaid payment rules, medical devices
  - Mining, offshore oil and gas, fisheries
  - Broadcast/TV licensing
