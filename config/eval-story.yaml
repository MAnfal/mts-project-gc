# The eval view's prose (/evals). Validated by EvalStorySchema (src/lib/evals/story-schema.ts).
#
# Reword anything here freely, but type no numbers: the schema rejects a digit outside {{placeholders}}.
# Every number on the page is either
#   - a {{placeholder}} filled from public/evals/index.json (names: src/lib/evals/story.ts → storyContext), or
#   - a quote resolved verbatim from an iteration's recorded decision or notes: `start` is where the quote
#     begins, `before` is where it stops (both number-free; `start` must appear once).

page:
  title: "Evaluation summary"
  description: "Frozen eval set · graded by code against hand-checked answer keys"

verdict:
  beatsAll: "Beats a single-prompt baseline on every measure, and meets {{verdict.met}} of {{verdict.total}} targets"
  beatsSome: "Beats a single-prompt baseline on {{verdict.wins}} of {{verdict.compared}} measures, and meets {{verdict.met}} of {{verdict.total}} targets"
  sub: "{{verdict.misses}} On the held-out weeks ({{live.runs.test}} runs), precision is {{live.precision.test}} and recall {{live.recall.test}}."
  miss: "{{measure}} is {{gap}} short of its {{target}} target over all weeks ({{runs}} runs)."
  allMet: "Every target is met."

carl:
  context:
    text: "{{evalSet.companies}} companies × {{evalSet.weeks}} frozen weeks of real Federal Register data. {{evalSet.relevant}} rules that matter, {{evalSet.traps}} look-alikes that don't. {{evalSet.devWeeks}} weeks to tune on, {{evalSet.testWeeks}} held out."
    link: cases
    linkLabel: "Eval set"
  action:
    text: "A baseline, then {{iterations.changes}} changes one at a time, each chosen from error analysis on the tuning weeks. {{iterations.kept}} were kept."
    link: iterations
    linkLabel: "Iteration log"
  result:
    text: "All weeks, {{baseline.runs.all}} baseline runs vs {{live.runs.all}} live: recall {{baseline.recall.all}} → {{live.recall.all}}, precision {{baseline.precision.all}} → {{live.precision.all}}, dates matching the answer key {{baseline.datesRight.all}} → {{live.datesRight.all}}, at {{cost.liveShareOfBaseline}} of the baseline's cost per run."
    link: scoreboard
    linkLabel: "Scoreboard"
  learning:
    text: "Telling the model what does not count was the prompt change that moved precision most. Reading the most relevant passages of the full text, not just the abstract, found the rule every earlier run had missed."
    link: live-iteration
    linkLabel: "Findings"

measures:
  recall: "Found what matters (recall)"
  precision: "Flags that were right (precision)"
  datesRight: "Dates match the answer key"
  tierAgreement: "Same tier across repeats"
  relevanceAgreement: "Same relevance call across repeats"
  costPerRunUsd: "Cost per run"
  trapAvoidance: "Look-alikes left alone"
  tierRight: "Tier right vs answer key"
  ownerRight: "Owner right vs answer key"
  judgePass: "Judge panel passed the action"
  consistency: "Right in every repeat (pass^k)"
  traceChecks: "Trace checks passed"
  score: "Weighted score"
  secondsPerRun: "Time per run"

iterations:
  00-baseline:
    label: "Baseline"
    outcome: reference
    summary: "One prompt to Sonnet with web search. It flags little but misses rules that change what a company must do: the bar to beat."
    gist:
      why: "Can one strong model with web search do the whole weekly triage in a single prompt?"
      change: "No pipeline: one task prompt plus web search, then a formatting step, graded by the same code as everything else."
    moved:
      - tag: worse
        text: "Missed rules that directly change what a company must do."
        quote: { from: decision, start: "it missed", before: ", and it is" }
      - tag: worse
        text: "The only setup failing trace checks."
        quote: { from: decision, start: "it is the only setup failing trace checks", before: ". This is what" }
  01-first-pipeline:
    label: "First pipeline"
    outcome: kept
    summary: "Switched to the staged pipeline: it found almost everything that matters, but fell for look-alike rules."
    gist:
      why: "A cheap screen, then an LLM filter, then code-checked dates and tiers should find more than one prompt can."
      change: "The pipeline as designed, with default prompts: four model and method setups plus the baseline, each run three times."
    moved:
      - tag: better
        text: "Found far more of what matters than the baseline."
        quote: { from: decision, start: "Recall", before: ", but precision" }
      - tag: worse
        text: "Fell for look-alike rules."
        quote: { from: decision, start: "but precision only", before: ". Next:" }
  02-strict-prompt:
    label: "Strict prompt"
    outcome: kept
    summary: "Told the filter what does not count: false alarms fell sharply for a small loss in recall. Went live."
    gist:
      why: "Most false flags were look-alikes: other models or industries, closed deadlines, paperwork renewals."
      change: "A strict filter prompt that lists those exclusions. Nothing else changed."
    moved:
      - tag: better
        text: "Far fewer false alarms."
        quote: { from: decision, start: "Precision", before: ", recall" }
      - tag: worse
        text: "A little recall given up."
        quote: { from: decision, start: "recall", before: ". Held up" }
      - tag: better
        text: "Held up on the held-out week."
        quote: { from: decision, start: "Held up on the held-out test week", before: ". Still" }
  03-strict-v2:
    label: "Prompt fixes"
    outcome: rejected
    summary: "Prompt fixes from error analysis raised false alarms, so the prompt was rejected; its every-date card was kept."
    gist:
      why: "Cards showed only one date, the filter missed rules that affect supply, and some actions were vague."
      change: "A revised strict prompt: a supply-effects inclusion, one more exclusion, sharper actions, and every verified date on the card."
    moved:
      - tag: worse
        text: "More false alarms on the tuning weeks."
        quote: { from: decision, start: "precision fell", before: ". strict-v" }
      - tag: fixed
        text: "Every verified date now shows on the card; that part was kept."
        quote: { from: decision, start: "Kept: the every-verified-date card", before: " and the eval fixes" }
  04-filter-vote:
    label: "Majority vote"
    outcome: rejected
    summary: "Ran the filter three times and kept the majority answer: steadier on tuning weeks, but no better on held-out weeks at twice the cost. Rejected."
    gist:
      why: "The same setup gave different answers between repeats, and every flip happened at the LLM filter."
      change: "Same setup, but the LLM filter runs three times and a document is kept only if most passes flag it."
    moved:
      - tag: better
        text: "Steadier and more precise on the tuning weeks."
        quote: { from: decision, start: "Dev: recall tied", before: ". Test does not hold" }
      - tag: worse
        text: "The gain did not hold on the held-out weeks."
        quote: { from: decision, start: "Test does not hold", before: ". Suite consistency" }
      - tag: worse
        text: "More than double the cost per run."
        quote: { from: decision, start: "Cost per run", before: ". Judge pass" }
  05-strict-v3:
    label: "Exclusions"
    outcome: not promoted
    summary: "Told the filter to skip rules that bind only the agency or other kinds of entity: no measurable effect. Not promoted."
    gist:
      why: "The filter's biggest precision loss was flagging rules whose duty falls on someone else."
      change: "Another revised strict prompt: the strict prompt plus two exclusions, and a guard keeping supply and price effects relevant."
    moved:
      - tag: worse
        text: "The targeted documents did not move."
        quote: { from: decision, start: "Mechanism check on the targeted docs", before: ". The control already" }
      - tag: better
        text: "Fewer trap hits on the tuning weeks, but not on the targeted documents."
        quote: { from: decision, start: "The dev trap-hit gap", before: "; the control's own" }
  06-passages:
    label: "Passages"
    outcome: promoted
    summary: "Let the filter read the most relevant passages of each rule, not just the abstract: it found the rule every earlier run missed. Promoted to live."
    gist:
      why: "The filter was the only lossy step: it rejected a real rule whose key provision wasn't in the abstract."
      change: "For the screen's top-ranked documents, the screen picks the best passages of the full text and the filter reads them too."
    noiseNote: "The recorded decision below measured noise differently: the control's swing across all four of its identical-config suites, per eighteen runs. That wider band is why the decision calls the overall gains inside the noise, while this table, using only the two suites shown, puts the precision gap beyond it."
    moved:
      - tag: fixed
        text: "The power-bank rule, missed by every earlier run, is now found."
        quote: { from: decision, start: "the targeted gain is", before: ". Trade-off found" }
      - tag: better
        text: "Fewer held-out misses and trap hits, pooled over both suites."
        quote: { from: decision, start: "Pooled over suite", before: "; dev misses" }
      - tag: worse
        text: "The DEA quota rules are sometimes dropped when the passages put the duty on manufacturers."
        quote: { from: decision, start: "with passages the filter sometimes drops", before: "likely because" }
      - tag: worse
        text: "Each run costs more."
        quote: { from: decision, start: "Cost per run", before: ". Rule difference" }
  07-next:
    label: "Next"
    outcome: next
    moved: []

# The Models page (/evals/models). Models are compared only within one suite. Placeholders come from
# modelsContext (src/lib/evals/story.ts): {{models.*}} from index.json (the like-for-like pair: same method and
# prompt, the live model against another), {{judges.*}} from config/judges.yaml, {{measures.*}} from above.
models:
  title: "Models"
  description: "Which model the pipeline runs, and why · models are compared only within one suite, on the same eval set and answer keys"
  liveRule: "Highlighted rows run the live model, {{models.live}}. The live setup itself ({{models.liveSetup}}) came later and never ran beside another model, so these rows are earlier setups on each model."
  singleModel: "Single model, no comparison"
  why:
    heading: "Why {{models.live}}"
    intro: "In suite {{models.suite}}, two setups differ only in the model: {{models.pair.live}} on {{models.live}} and {{models.pair.other}} on {{models.other}}, both the {{models.pair.method}} method with the {{models.pair.promptSet}} prompt, over all of the suite's weeks."
    points:
      - "{{measures.recall}}: {{models.recall.live}} vs {{models.recall.other}}, {{models.recall.diff}} on {{models.live}} ({{models.recall.runs}})."
      - "{{measures.precision}}: {{models.precision.live}} vs {{models.precision.other}}, {{models.precision.diff}} on {{models.live}} ({{models.precision.runs}})."
      - "{{measures.costPerRunUsd}}: {{models.costPerRunUsd.live}} vs {{models.costPerRunUsd.other}}, {{models.costPerRunUsd.diff}} on {{models.live}} ({{models.costPerRunUsd.runs}})."
    closing: "No recorded decision explains the choice in words; these measured differences are what it rests on."
  caveats:
    keyBias:
      holds: "Possible key bias. The answer keys were drafted by Claude models. Among the {{models.pipeline.count}} pipeline setups in suite {{models.suite}}, the lowest recall, {{models.lowest.recall}} ({{models.lowest.runs}}), is held by {{models.lowest.setups}}. Pipeline setups at that recall: {{models.lowest.count}}; pipeline setups on a non-Claude model: {{models.otherVendor.count}}, the same ones. The single-prompt baseline is not a pipeline and is left out of this ranking; its recall is in the table."
      otherwise: "Possible key bias. The answer keys were drafted by Claude models. Among the {{models.pipeline.count}} pipeline setups in suite {{models.suite}}, the lowest recall, {{models.lowest.recall}} ({{models.lowest.runs}}), is held by {{models.lowest.setups}}. The single-prompt baseline is not a pipeline and is left out of this ranking; its recall is in the table."
    priceParity: "Price parity. The arena config (a comment in config/setups.yaml) records that the models were chosen at the same AI Gateway list price per token, checked on {{models.priceCheckedOn}}. The same price per token is not the same cost per run: the table shows each setup's measured cost."
    oneSuite: "One suite. The rationale above rests on suite {{models.suite}} alone: {{models.suiteWeeks}} weeks, {{models.suiteEvalsets}} company-weeks."
    tuning: "Tuned on one model. The live setup's {{models.livePromptSet}} prompt ran only on {{models.livePromptSetModels}}; {{models.other}} ran only with the {{models.otherPromptSets}} prompt."
  judges: "The judge panel is a separate use of models. It grades the wording of every setup's actions alike, so it played no part in choosing the pipeline's model. A verdict needs {{judges.minAgree}} of the {{judges.count}} judges to agree:"

# Under the summary's number cards. {{live.label}} / {{live.setup}} come from index.json.
cards:
  liveLine: "These numbers are the setup every GC run uses now: {{live.label}}."
  liveLink: "See its configuration and prompts"

# The Live setup page (/evals/setup). Placeholders come from liveSetupContext (src/lib/evals/liveSetup.ts), read from
# config/ on each request, so the page shows what a GC's run executes; match/mismatch compare it with index.json.
liveSetup:
  title: "Live setup"
  description: "What every GC run executes today · read from config/ on each request"
  intro: "Every run a GC starts uses {{setup.label}} ({{setup.id}}): {{model.label}}, through the {{method.label}} method."
  match: "This is the setup the evals promoted, in iteration {{iteration.number}} · {{iteration.label}}. The summary's scores are its runs."
  mismatch: "Not the setup the evals scored: the recorded live setup is {{recorded}}, but user runs now use {{setup.id}}."
  facts:
    model: "Model"
    method: "Method"
    screen: "Screen model"
    cutoff: "Screen cut-off"
    promptSet: "Prompt set"
    passages: "Full-text passages"
    votes: "Filter passes per run"
    webLeads: "Web leads"
  passages: "For the top {{passages.topN}} documents by screen score, the filter also reads the best {{passages.perDoc}} passages (about {{passages.chunkChars}} characters each) of the full text."
  noPassages: "Off: the filter reads each document's abstract only."
  stagesHeading: "The prompts, stage by stage"
  stages:
    screen:
      title: "Screen"
      text: "A cheap model ({{jevModel}}) scores every document in the window; anything under {{jevThreshold}} never reaches the LLM."
    filter:
      title: "Filter"
      text: "{{model.label}} decides which documents create, change or remove something this company must do."
    extract:
      title: "Extract dates"
      text: "{{model.label}} quotes every dated obligation verbatim; code then checks each date against the Federal Register."
    actions:
      title: "Write actions"
      text: "{{model.label}} writes one plain-English action per item. It writes no dates or citations: those are rendered from verified data."
  code:
    title: "Verify and tier (code, no model)"
    text: "Dates and citations are checked against the primary source, and the tier is assigned by code: a deadline under {{tiering.criticalWindowDays}} days is Critical."
  overridden: "Replaced by the {{promptSet}} prompt set: the default on the left, what live runs use on the right."
  defaultPane: "Default · config/prompts.yaml"
  livePane: "Live · config/prompt-sets/{{promptSet}}.yaml"
  placeholders: "Names in double braces are filled on each run: the company's profile, its areas, and the documents."
