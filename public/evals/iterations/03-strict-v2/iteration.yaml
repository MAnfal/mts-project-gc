id: 03-strict-v2
title: "Fixes chosen by error analysis: every verified date on the card, indirect-supply rules, specific actions"
date: 2026-11-22
suite: arena-2026-11-21-20-41-gip
setup: jev-sonnet-strict-v2
comparedTo: jev-sonnet-strict
hypothesis: "Error analysis of 02 on dev weeks only (error-analysis.json: 9 dev runs, 9 test runs never read) found: (1) cards show one date, so the effective date is lost when a comment deadline exists and notices show none; (2) the filter rejects real rules whose effect is on supply of what the company sells (no duty on the company), and accepts a payment rule for a different kind of provider; (3) some actions are generic (\"review and update\"). Fixing these should raise recall and dates right without losing precision, and lift the judges' pass rate."
change: "Prompt set strict-v2 (config/prompt-sets/strict-v2.yaml): filterSystem + inclusion line (supply/availability of products the company sells, even if the duty is on someone else) + exclusion line (payment/coverage rules for a different kind of provider); actionsSystem asks for the specific change and exactly one next step. Wording kept generic (no company-specific rules)."
codeChanges: Cards show every verified date with its label (ActionItem.datesShown), not one headline date. Applies to every setup in this suite, including the re-run of the current winner, so the setup comparison is like-for-like.
evalChanges: '(a) Judges see the dates shown on the card and are told a paraphrase counts for "covers" (dev evidence: 7 of 8 judge failures penalised a date the action deliberately omits). (b) Dev-week rubrics rewritten at gist level by a blind agent (rubricRevision in the keys); test-week keys untouched. (c) Date grading uses the dates each run actually displayed (older runs: the one headline date).'
decision: "Rejected; live config stays on jev-sonnet-strict. Decided on dev weeks only: recall tied (27/27 both), precision fell 93.1% -> 79.4% (trap hits 2 -> 7). strict-v2's higher test-week recall (14/15 vs 9/15) is not used to choose, since picking a change because of the test week is overfitting. Kept: the every-verified-date card (dates right ~74% -> 100%) and the eval fixes (judges see shown dates, gist-level dev rubrics)."
notes: "The same jev-sonnet-strict setup scored 93% test recall in the previous suite and 60% in this one, so its filter decisions drift between runs and 15 test rules make each swing large. Next (iteration 04): stability, i.e. a 3-pass majority vote on the filter, plus more eval weeks."
regradedSubset: "2026-11-22: re-graded with subset grading. Precision = found / (found + traps flagged); flags outside the key are reported separately and no longer count as false alarms (they include docs the key reviewers dropped as 50/50)."
