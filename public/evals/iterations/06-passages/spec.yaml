id: 06-passages
title: >-
  Jev re-ranks passages inside its top 20 docs; the LLM filter reads the best ones, not just the abstract
date: "2026-11-22"
suite: arena-2026-11-21-22-52-l92
setup: jev-sonnet-strict-passages
comparedTo: jev-sonnet-strict
targets:
  - rootCause:2
  - llm-filter-rejected-a-real-rule
hypothesis: >-
  Dev-only error analysis of 05's suite (error-analysis.json here: 18 dev runs, 18 test runs excluded; code graders,
  trace checks, judge panel, per-step scores). Per step: Jev keeps 100% of real flags and ranks all in its top 20;
  verify is 100%; the LLM filter is the only lossy step (keeps 91% of real flags). Root cause 2: the filter rejects a
  real rule whose operative provision isn't in the abstract (2026-21922: passenger power-bank limits buried in a
  PHMSA harmonization NPRM; missed 3 of 3 in every suite). Giving the filter Jev-selected passages from the full
  text should let it see such provisions. Predictions, both directions: flags kept by the filter rise (21922 flagged
  in at least 2 of 3 repeats); traps rejected by the filter do not fall (the traps it falls for rank 10-20 in Jev, so
  they also get passages: 2026-22743 is the one to watch).
change: >-
  New setup jev-sonnet-strict-passages = jev-sonnet-strict + filterExcerpts {topN 20, chunkChars 1200, perDoc 3,
  maxChunks 300}. topN fixed at 20 from dev ranks only. Same model, prompt set, Jev cut-off; docs outside the top 20
  still go to the filter with the abstract as before.
codeChanges: >-
  src/lib/pipeline/excerpts.ts (chunkText, pickPassages), filterPassages stage (traced as filter.passages: every
  pick with its Jev score), filterPrompt takes optional passages (byte-identical without them; Jev's own input never
  gets them). Tests: tests/filter-excerpts.test.ts. Both setups in this suite also run with the govinfo text-strip
  fix (90c6292), which the passages depend on.
evalChanges: >-
  None. Budget cap raised by the user to $130.
plan: >-
  Gate before the suite (~$1.5): candidate 3x on skyhop_2026-10-26_2026-10-30 and cornercare_2026-11-09_2026-11-13
  (the only dev errors that repeat in every suite). Proceed only if 21922 is flagged in >= 2 of 3 and no new trap is
  hit there. Suite 1: control vs candidate, 12 company-weeks x 3. Stop rule after suite 1: not promoted (no repeat) if
  21922 is flagged in < 2 of 3, or dev trap hits exceed the control's by more than 2. Otherwise replicate unchanged
  and decide on pooled runs: promote only if test recall and test trap hits are no worse than the control beyond the
  band. Band = the largest swing of the unchanged control across all its identical-config suites, new ones included.
decision: >-
  Promoted: jev-sonnet-strict-passages becomes the live setup (experiment.yaml userView.setup). Rule from the plan:
  promote if test recall and test trap hits are no worse than the control beyond the band. Pooled over suite 1 and
  the unchanged replicate (per 18 runs): test misses 5.3 (control) vs 3.1 (passages), test trap hits 10.6 vs 8.7;
  dev misses 3.0 vs 2.6, dev trap hits 3.5 vs 2.6. Both test metrics are better, but each overall gap is inside the
  control's A/A band (test misses swing 4.4, test trap hits 4.0 across its four identical-config suites), so the
  overall gain is not proven; the targeted gain is: 2026-21922 flagged 0/6 by the control in these suites (and in
  every earlier suite) vs 9/9 with passages, including the dev gate. Trade-off found: with passages the filter
  sometimes drops the DEA quota rules 2026-22842 and 2026-22843 (3 of 8 dev runs each; the control keeps them), likely
  because the passages state the duties fall on manufacturers. Cost per run $0.126 -> ~$0.20. Rule difference, stated
  openly: this plan's rule ("no worse beyond the band") is looser than the tie-breaker written in 05's notes
  ("inconclusive -> the cheaper setup stays", under which 04 was dropped on cost). It was written before this suite
  ran, so it stands; under 05's rule this would be inconclusive. Robustness: per suite, test misses were 4 vs 3 (l92)
  and 6 vs 3 (du8), test trap hits 11 vs 6 (l92) and 9 vs 9 (du8); on company-week x repeat slots where both setups
  finished (34 each): test misses 10 vs 6, trap hits 20 vs 15; dev misses 6 vs 5, trap hits 6 vs 5. On dev this is a
  trade (one doc fixed, two degraded), and flags-only 3-run agreement regressed from 89.5% to 82.5%.
notes: >-
  Replicate suite: arena-2026-11-21-23-16-du8 (unchanged). Dev gate: arena-2026-11-21-22-48-27v (6 runs). The
  iteration record's metrics are computed on suite 1 only; the pooled numbers above are the decision basis. Five runs
  across the two suites failed on Gateway outages ("Service temporarily unavailable"), so per-18-run rates are used.
  Control A/A per suite (dev trap hits / test trap hits / test misses per 18 runs): 64r 5/8/5.0, jq4 4/12/2.0,
  l92 4/11.6/4.2, du8 3/9.5/6.4. Passage picks for 21922 contain the power-bank limits (trace event filter.passages).
  Next target: indirect supply rules dropped when passages describe duties on other parties (the quota rules).
