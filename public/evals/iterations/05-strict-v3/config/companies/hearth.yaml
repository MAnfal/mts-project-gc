# Company profile "hearth". Demo company: held out of every eval set; only offered in the user view.

id: hearth
use: demo
name: Hearth Home Appliances
summary: US maker of kitchen and laundry appliances (~2,000 employees, factories in Tennessee and Ohio). Sells refrigerators, dishwashers, washing machines and microwaves through big-box stores and its own website. Imports some parts from Mexico and Asia. No food, no medicine, no vehicles.
businessLines:
  - Refrigerators, dishwashers, washers and microwaves
  - Retail and online sales with product warranties
  - Factories with ~1,500 workers
  - Imported parts and components
applies:
  - DOE energy and water efficiency standards for home appliances
  - Consumer product safety rules and recalls (CPSC)
  - EPA rules on refrigerants and chemicals in products
  - Tariffs and trade rules on imported appliance parts
  - Factory workplace safety (OSHA) and labor rules
doesNotApply:
  - Food, drugs, medical devices, aviation, banking
  - Energy rules for power plants, pipelines or utilities
