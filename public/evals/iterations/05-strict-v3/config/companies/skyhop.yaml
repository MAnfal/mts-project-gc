# Company profile "skyhop". Relevance anchor for every prompt; each area routes to exactly one owner.
# Eval company: a regional airline. Its fleet is deliberately specific, so safety directives for other
# aircraft models are realistic look-alike traps.

id: skyhop
use: eval
name: SkyHop Airlines
summary: US regional airline (~3,500 employees) flying short domestic routes from hubs in Denver and Salt Lake City. Fleet is 60 Embraer E175 jets and 25 Airbus A320-family jets (A319 and A320). Sells tickets online and at airports, charges bag fees, and runs its own maintenance hangar. Does not fly Boeing aircraft, Airbus A220/A350, or helicopters; no cargo-only flights, no international routes.
businessLines:
  - Scheduled passenger flights (domestic only)
  - Ticket sales, fees and refunds
  - Aircraft maintenance for its own Embraer E175 and Airbus A319/A320 fleet
  - Pilots, flight attendants and ground crew
applies:
  - FAA airworthiness directives for Embraer E175 (ERJ 170 family) or Airbus A319/A320, and their engines
  - FAA rules for airline operations, pilots, crew rest and drug/alcohol testing
  - DOT consumer rules for airline passengers (refunds, fees, accessibility)
  - Airspace or airport rules at Denver or Salt Lake City, and airport fees charged to passengers
  - TSA security rules for airlines
doesNotApply:
  - Airworthiness directives for aircraft models we do not fly (Boeing, A220, A350, business jets, small planes, helicopters)
  - Airspace changes at airports we do not serve
  - Commercial space launches, drones, air-traffic-control equipment
  - Banking, food, pharmacy, energy
areas:
  maintenance:
    description: Airworthiness directives, inspections, parts for our fleet
    owner:
      name: Carlos Mendez (Director of Maintenance)
      email: maintenance@skyhop.example
  flight-ops:
    description: Flight operations, pilots and crew rules, airspace at our hubs
    owner:
