# Eval sets = (company, week) pairs with a frozen input and an answer key. The code only executes these.
# weeks/<start>_<end>.json  — every Federal Register document published that week, frozen (scan reads this,
#                             so reruns see identical input; verification still re-fetches live).
# keys/<company>_<start>_<end>.json — which docs matter + expected deadline, with provenance. Frozen keys
#                             (provenance set) can't be overwritten by the Label page.
weeks:
  - id: 2026-11-09_2026-11-13
    windowStart: "2026-11-09"
    windowEnd: "2026-11-13"
    asOf: "2026-11-13"
    note: 448 docs, fetched 2026-11-21 from the Federal Register documents API
evalsets:
  - id: brightside_2026-11-09_2026-11-13
    company: brightside
    week: 2026-11-09_2026-11-13
