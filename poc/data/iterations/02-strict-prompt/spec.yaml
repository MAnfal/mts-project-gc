id: 02-strict-prompt
title: >-
  A strict filter prompt that spells out what does not count
date: "2026-11-21"
suite: arena-2026-11-21-18-40-w0i
setup: jev-sonnet-strict
comparedTo: jev-sonnet
hypothesis: >-
  Most false flags are look-alikes (other aircraft models or industries, closed comment periods, paperwork renewals, corrections). Listing those exclusions in the LLM filter's system prompt should cut false flags without losing real ones.
change: >-
  New prompt set config/prompt-sets/strict.yaml overriding only filterSystem; everything else identical (same model, Jev cut-off 0.1, same eval sets and repeats).
decision: >-
  Kept and promoted to the live user view (experiment.yaml → userView.setup). Precision 45% → 79.6%, trap hits 2.4 → 0.4 per run, recall 98% → 93%. Held up on the held-out test week (124/132 vs 109/132 cases right). Still 0.4 pts under the 80% precision target; next: find out what the remaining false flags and misses have in common (error analysis).
notes: >-
  The exclusions mirror our trap taxonomy, so the test week is what keeps this honest; recall on the test week rests on few rules.
regraded: >-
  2026-11-22: re-graded with the fixed judge input (judges now see the verified date shown next to each action). The original verdicts are kept in each run's trace (earlier judge.call events).
